<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dorian · 录音分析</title>
  <link rel="stylesheet" href="/v2/style.css">
  <header><strong>Dorian <i>/</i> EP 01</strong><nav><a id="preview">成片预览</a><a id="editor">原曲打点</a></nav></header>
  <main>
    <h1 id="title">录音分析</h1>
    <div
      class="row"><label>场景 <select id="scene"></select></label><span id="status" role="status"></span></div>
    <section id="film" hidden>
      <canvas id="stage" width="1920" height="1080"></canvas>
      <div class="row"
        id="layers"><label>主题 <select id="theme"><option value="light">暖白</option><option value="dark">深炭灰</option></select></label></div>
    </section>
    <section id="align"
      hidden><div class="row"><label>素材 <select id="track"></select></label><label>切入点 ms <input id="source" type="number" min="0"></label><button id="markIn">设为切入点</button><button id="markOut">设为切出点</button><label>速度 <select id="rate"><option>0.5</option><option>0.75</option><option selected>1.0</option></select> ×</label></div>
<canvas id="wave" width="1600" height="170"></canvas><small>点击波形定位 · 橙线为候选变化 · 蓝线为所选节目切片</small></section>
    <audio id="audio" controls preload="metadata"></audio>
    <section id="marks" hidden>
      <div
        class="row"><label>和弦 <input id="symbol" value="Em7"></label><label>调式 <select id="mode"><option>dorian</option><option>aeolian</option><option>chromatic</option><option value="">未定</option></select></label><button id="harmony">H 换和弦</button><button id="bars">M 小节起点</button><button id="beat">B 拍点</button><button id="cues">Q 字幕起点</button><button id="cueEnd">E 字幕结束</button></div>
      <label>本场标注（节目绝对毫秒，可直接编辑）<textarea id="events" spellcheck="false"></textarea></label>
      <div
        class="row"><button id="save">保存节目配置</button><button id="export">导出场景 JSON</button></div>
    </section>
  </main>
  <script type="module" src="/v2/ui.mjs"></script>
</html>
